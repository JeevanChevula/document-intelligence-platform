name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

      # a real Postgres, for the same reason as the real Qdrant above: the
      # properties worth testing here (multi-tenant isolation, the message
      # cascade on chat deletion) are enforced by the database itself, so a
      # mock would only confirm our own assumptions back at us
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # without this, tests can start before Postgres is accepting connections
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # GROQ_API_KEY stays a dummy — every LLM call in the suite is mocked, so
      # CI never spends real quota. Postgres and Qdrant are genuinely running.
      GROQ_API_KEY: dummy-key-for-ci
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: test-secret-key-for-ci
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system dependencies (Tesseract, for OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create the database schema
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v
